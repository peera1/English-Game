<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#75c8f5">
<title>Word Hero – גיבורי המילים באנגלית</title>
<style>
:root{--ink:#243052;--muted:#66708e;--blue:#4778f5;--purple:#8c62e8;--pink:#ff83ac;--yellow:#ffd86f;--green:#32b982;--paper:#fff;--shadow:0 18px 55px #3e4d8c26}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(circle at 12% 18%,#fff5b9 0 7%,transparent 7.3%),radial-gradient(circle at 91% 79%,#d7f8e9 0 9%,transparent 9.3%),linear-gradient(135deg,#9de6fc,#c4aaf8 65%,#f7b5cf);color:var(--ink)}
button{font:inherit}
.app{width:min(100%,850px);margin:auto}.card{background:#ffffffed;border:3px solid #fff;border-radius:32px;padding:clamp(22px,5vw,46px);box-shadow:var(--shadow);text-align:center;overflow:hidden}.hide{display:none!important}
.hero{font-size:clamp(68px,13vw,106px);line-height:1.2;filter:drop-shadow(0 8px 0 #f4d66c);animation:bob 2.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.title{font-size:clamp(38px,8vw,64px);line-height:1;margin:8px 0;color:#435dd2;letter-spacing:-1.5px}.intro{font-size:clamp(20px,4vw,27px);line-height:1.55;margin:18px auto;max-width:620px}.howto{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#fff7d6;border-radius:18px;padding:12px 18px;margin:12px 0 22px;font-weight:800}.howto span{font-size:27px}
.btn{border:0;border-radius:20px;padding:16px 30px;background:linear-gradient(135deg,#ff9b67,#ff6f9d);color:white;font-weight:800;font-size:clamp(20px,4vw,25px);box-shadow:0 7px 0 #d95d82,0 12px 22px #bd5c8950;cursor:pointer;transition:.15s transform,.15s box-shadow}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #d95d82}.btn.secondary{background:linear-gradient(135deg,#70b7fa,#7d86ee);box-shadow:0 7px 0 #5964c0}.btn.secondary:active{box-shadow:0 2px 0 #5964c0}
button:focus-visible{outline:4px solid #ffc94d;outline-offset:4px}.note{color:var(--muted);font-size:15px;line-height:1.5}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;font-size:18px;font-weight:800}.track{height:18px;border-radius:99px;background:#edf0ff;overflow:hidden}.bar{height:100%;width:10%;background:linear-gradient(90deg,#70d5a7,#7bd7e8,#8f86ec);border-radius:99px;transition:.35s width}.icon-btn{border:0;background:#eef2ff;color:#5664bd;border-radius:14px;min-width:48px;height:48px;font-size:25px;cursor:pointer}
.game-card{padding:clamp(20px,4vw,36px)}.round-label{display:inline-block;background:#ecedff;color:#5761bc;border-radius:99px;padding:7px 15px;font-weight:800;margin-bottom:12px}.word{font-size:clamp(42px,9vw,70px);line-height:1.05;margin:10px 0 18px;color:#26366f}.word .sub{display:block;color:#66708e;font-size:.42em;margin-top:8px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.choice{min-height:clamp(138px,24vw,195px);border:3px solid #edf0ff;border-radius:25px;background:linear-gradient(160deg,#fdfdff,#edf2ff);box-shadow:0 7px 0 #dfe4f6;cursor:pointer;transition:.16s transform,.16s border-color,.16s background;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}.choice:hover{transform:translateY(-4px);border-color:#bbc5ff}.choice .emoji{font-size:clamp(50px,11vw,78px);line-height:1.1}.choice .hebrew{font-size:clamp(20px,4vw,27px);font-weight:900;margin-top:8px}.choice.correct{background:linear-gradient(145deg,#dcfff1,#effff7);border-color:#37bd86;box-shadow:0 7px 0 #9edbc3}.choice.wrong{background:linear-gradient(145deg,#fff0f2,#ffe5e9);border-color:#ef7182;box-shadow:0 7px 0 #dfabb4}.choice:disabled{cursor:default}.choice.correct,.choice.wrong{transform:scale(.98)}
.message{min-height:31px;margin:12px 0 0;font-size:clamp(20px,4vw,26px);font-weight:900}.message.good{color:#1d9b69}.message.bad{color:#cf4c67}.message.neutral{color:var(--muted)}
.success-screen{position:relative;isolation:isolate}.success-card{background:linear-gradient(145deg,#fffef7,#f2fff8);border:4px solid #fff;border-radius:32px;padding:clamp(24px,5vw,44px);box-shadow:0 18px 55px #3e4d8c26;text-align:center}.success-burst{font-size:clamp(74px,15vw,118px);line-height:1.05;filter:drop-shadow(0 8px 0 #f4d66c)}.success-title{font-size:clamp(38px,8vw,58px);line-height:1.1;margin:12px 0 8px;color:#32a975}.success-english{font-size:clamp(22px,5vw,32px);font-weight:900;color:#435dd2;margin:0}.success-hebrew{font-size:clamp(20px,4vw,27px);color:var(--muted);margin:8px 0 22px}#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}@keyframes fall{to{transform:translate(var(--drift),90vh) rotate(720deg)}}
.end-card .hero{animation:none}.summary-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px 0}.stat{min-width:125px;background:linear-gradient(145deg,#fff,#eef2ff);border:1px solid #e4e7ff;border-radius:18px;padding:12px}.stat strong{display:block;font-size:32px;color:#5561bf}.stat span{font-size:16px;color:var(--muted)}
@media(max-width:560px){body{padding:12px}.card,.success-card{border-radius:25px;padding:22px 16px}.top{gap:7px;font-size:15px}.track{height:14px}.choices{gap:9px}.choice{min-height:128px;border-radius:19px}.choice .emoji{font-size:48px}.choice .hebrew{font-size:20px}.btn{width:100%;padding:15px 18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <section id="start" class="card" aria-labelledby="startTitle"><div class="hero" aria-hidden="true">🦸‍♂️🔤</div><h1 class="title" id="startTitle">Word Hero</h1><p class="intro">ברוכים הבאים למשחק גיבורי המילים!<br>בחרו את התמונה והמשמעות המתאימות למילה באנגלית.</p><div class="howto"><span aria-hidden="true">👂</span><b>נשמעים</b><span aria-hidden="true">👀</span><b>רואים</b><span aria-hidden="true">✅</span><b>בוחרים</b></div><br><button class="btn" id="startBtn" type="button">בואו נתחיל!</button></section>
  <section id="game" class="hide" aria-label="משחק מילים"><div class="top"><span id="count">שאלה 1 מתוך 15</span><div class="track" role="progressbar" aria-label="התקדמות המשחק" aria-valuemin="0" aria-valuemax="15" aria-valuenow="1"><div class="bar" id="bar"></div></div><button class="icon-btn" id="listen" type="button" aria-label="האזינו למילה">🔊</button></div><div class="card game-card"><span class="round-label" id="roundLabel">בחרו את התשובה הנכונה</span><div class="word" id="word"><span id="englishWord"></span><span class="sub" id="hebrewHint"></span></div><div class="choices" id="choices"></div><p class="message neutral" id="msg" aria-live="polite"></p></div></section>
  <section id="success" class="success-screen hide" aria-live="polite"><div id="confetti" aria-hidden="true"></div><div class="success-card"><div class="success-burst" id="successEmoji" aria-hidden="true">🌟</div><h2 class="success-title" id="successTitle">נכון!</h2><p class="success-english" id="successEnglish"></p><p class="success-hebrew" id="successHebrew"></p><button class="btn" id="nextBtn" type="button">השאלה הבאה</button></div></section>
  <section id="end" class="card end-card hide" aria-labelledby="endTitle"><div class="hero" id="endEmoji" aria-hidden="true">🏆</div><h1 class="title" id="endTitle">כל הכבוד!</h1><p class="intro" id="endText">סיימתם את המשחק!</p><div class="summary-stats"><div class="stat"><strong id="finalScore">0</strong><span>תשובות נכונות</span></div><div class="stat"><strong id="finalAttempts">0</strong><span>ניסיונות</span></div></div><button class="btn" id="again" type="button">משחק נוסף</button></section>
</main>
<script>
'use strict';
const WORDS=[
 {word:'Dog',hebrew:'כלב',emoji:'🐶'},
 {word:'Cat',hebrew:'חתול',emoji:'🐱'},
 {word:'Cow',hebrew:'פרה',emoji:'🐮'},
 {word:'Pig',hebrew:'חזיר',emoji:'🐷'},
 {word:'Duck',hebrew:'ברווז',emoji:'🦆'},
 {word:'Bird',hebrew:'ציפור',emoji:'🐦'},
 {word:'Fish',hebrew:'דג',emoji:'🐟'},
 {word:'Frog',hebrew:'צפרדע',emoji:'🐸'},
 {word:'Lion',hebrew:'אריה',emoji:'🦁'},
 {word:'Bear',hebrew:'דוב',emoji:'🐻'},
 {word:'Apple',hebrew:'תפוח',emoji:'🍎'},
 {word:'Cake',hebrew:'עוגה',emoji:'🎂'},
 {word:'Food',hebrew:'אוכל',emoji:'🍔'},
 {word:'Ice cream',hebrew:'גלידה',emoji:'🍦'},
 {word:'Milk',hebrew:'חלב',emoji:'🥛'},
 {word:'Baby',hebrew:'תינוק',emoji:'👶'},
 {word:'Brother',hebrew:'אח',emoji:'👦'},
 {word:'Father',hebrew:'אבא',emoji:'👨'},
 {word:'Family',hebrew:'משפחה',emoji:'👨‍👩‍👧‍👦'},
 {word:'Banana',hebrew:'בננה',emoji:'🍌'},
 {word:'Sun',hebrew:'שמש',emoji:'☀️'},
 {word:'Star',hebrew:'כוכב',emoji:'⭐'},
 {word:'Car',hebrew:'מכונית',emoji:'🚗'},
 {word:'Ball',hebrew:'כדור',emoji:'⚽'},
 {word:'Book',hebrew:'ספר',emoji:'📘'},
 {word:'House',hebrew:'בית',emoji:'🏠'},
 {word:'Flower',hebrew:'פרח',emoji:'🌸'},
 {word:'Tree',hebrew:'עץ',emoji:'🌳'},
 {word:'White',hebrew:'לבן',emoji:'⬜'},
 {word:'Blue',hebrew:'כחול',emoji:'🟦'},
 {word:'Green',hebrew:'ירוק',emoji:'🟩'},
 {word:'Red',hebrew:'אדום',emoji:'🟥'},
 {word:'Yellow',hebrew:'צהוב',emoji:'🟨'},
 {word:'Friend',hebrew:'חבר',emoji:'🧒'},
 {word:'Clock',hebrew:'שעון',emoji:'🕐'},
 {word:'Chair',hebrew:'כיסא',emoji:'🪑'},
 {word:'Bed',hebrew:'מיטה',emoji:'🛏️'},
 {word:'Table',hebrew:'שולחן',emoji:'🍽️'},
 {word:'One',hebrew:'אחת',emoji:'1️⃣'},
 {word:'Two',hebrew:'שתיים',emoji:'2️⃣'},
 {word:'Three',hebrew:'שלוש',emoji:'3️⃣'},
 {word:'Four',hebrew:'ארבע',emoji:'4️⃣'},
 {word:'Five',hebrew:'חמש',emoji:'5️⃣'}
];
const PRAISES=[
 {english:'Amazing work!',hebrew:'עבודה מדהימה!'},
 {english:'You did it!',hebrew:'הצלחתם!'},
 {english:'Fantastic job!',hebrew:'עבודה נהדרת!'},
 {english:'Excellent!',hebrew:'מצוין!'}
];
const $=id=>document.getElementById(id);
let questions=[],results=[],index=0,score=0,locked=false,waitingNext=false;
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=/^[A-Za-z]/.test(text)?'en-US':'he-IL';utterance.rate=.8;speechSynthesis.speak(utterance)}
function showMessage(text,type='neutral'){$('msg').textContent=text;$('msg').className='message '+type}
function startGame(){if('speechSynthesis'in window)speechSynthesis.cancel();questions=shuffle(WORDS).slice(0,15);results=questions.map(question=>({question,chosen:null,correct:false,attempts:0}));index=0;score=0;$('start').classList.add('hide');$('end').classList.add('hide');$('success').classList.add('hide');$('game').classList.remove('hide');showQuestion()}
function showQuestion(){locked=false;waitingNext=false;const answer=questions[index];const options=shuffle([answer,...shuffle(WORDS.filter(item=>item.word!==answer.word)).slice(0,2)]);$('count').textContent=`שאלה ${index+1} מתוך 15`;$('bar').style.width=((index+1)/15*100)+'%';$('bar').parentElement.setAttribute('aria-valuenow',index+1);$('englishWord').textContent=answer.word;$('hebrewHint').textContent=''+answer.hebrew;$('choices').replaceChildren();showMessage('');for(const item of options){const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=`<span class="emoji" aria-hidden="true">${item.emoji}</span><span class="hebrew">${item.hebrew}</span>`;button.setAttribute('aria-label',item.hebrew);button.addEventListener('click',()=>choose(button,item,answer));$('choices').append(button)}speak(answer.word)}
function launchConfetti(){const host=$('confetti');host.replaceChildren();const colors=['#ff83ac','#ffd86f','#4778f5','#32b982','#8c62e8','#ff6f9d'];for(let i=0;i<70;i++){const piece=document.createElement('span');piece.className='piece';piece.style.left=(Math.random()*100)+'%';piece.style.background=colors[i%colors.length];piece.style.animationDuration=(2+Math.random()*2)+'s';piece.style.setProperty('--drift',(Math.random()*180-90)+'px');host.append(piece)}}
function choose(button,item,answer){if(locked||waitingNext||button.disabled)return;const buttons=[...$('choices').querySelectorAll('button')];const result=results[index];result.attempts++;result.chosen=item.word;result.correct=(item.word===answer.word);if(result.correct){score++;button.classList.add('correct');showMessage('נכון! כל הכבוד!', 'good');locked=true;waitingNext=true;for(const option of buttons)option.disabled=true;const praise=PRAISES[Math.floor(Math.random()*PRAISES.length)];setTimeout(()=>{$('successEmoji').textContent=answer.emoji;$('successEnglish').textContent=praise.english+' '+answer.word;$('successHebrew').textContent=praise.hebrew+' – '+answer.hebrew;$('success').classList.remove('hide');$('game').classList.add('hide');launchConfetti();speak(answer.word+' '+praise.english)},650)}else{button.classList.add('wrong');showMessage('לא נכון, נסו שוב!', 'bad');button.disabled=true}}
function nextQuestion(){if(!waitingNext)return;if(index>=questions.length-1)finish();else{index++;waitingNext=false;$('success').classList.add('hide');$('game').classList.remove('hide');showQuestion()}}
function finish(){waitingNext=false;if('speechSynthesis'in window)speechSynthesis.cancel();$('success').classList.add('hide');$('game').classList.add('hide');$('end').classList.remove('hide');$('bar').style.width='100%';const attempts=results.reduce((total,result)=>total+result.attempts,0);$('finalScore').textContent=score+'/'+questions.length;$('finalAttempts').textContent=attempts;$('endText').textContent=score>=12?'נהדר! שלטתם במילים!':score>=8?'עבודה טובה! כמעט שם!':'כל הכבוד על ההשתתפות!';speak('כל הכבוד!')}
$('startBtn').addEventListener('click',startGame);$('again').addEventListener('click',startGame);$('nextBtn').addEventListener('click',nextQuestion);$('listen').addEventListener('click',()=>{if(questions[index])speak(questions[index].word)});
</script>
</body>
</html>
