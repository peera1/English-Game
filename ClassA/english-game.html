<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Hero – כיתה א׳</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(145deg,#6dd5fa,#b993ff);font-family:Arial,sans-serif;color:#27304a}.app{width:min(760px,100%)}.card{padding:24px;background:white;border-radius:26px;box-shadow:0 12px 32px #26304a33;text-align:center}.hide{display:none!important}.hero{font-size:4rem}h1{font-size:clamp(2rem,7vw,3rem);margin:8px}p{font-size:1.15rem;line-height:1.6}.btn,.listen{border:0;border-radius:999px;padding:13px 24px;font-size:1.15rem;font-weight:bold;cursor:pointer}.btn{background:#ff9f1c;color:white;box-shadow:0 5px #c97800}.listen{background:#eef3ff;color:#3b4cca}.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#fff;font-weight:bold}.lives{white-space:nowrap}.track{height:16px;border-radius:99px;background:#ffffff77;flex:1;overflow:hidden}.bar{height:100%;background:#ffcf56;transition:width .25s}.word{font-size:clamp(3.2rem,15vw,6rem);font-weight:900;color:#3b4cca;direction:ltr;margin:16px}.msg{min-height:3rem;font-size:1.5rem;font-weight:bold;margin:16px 0 8px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr}.opt{aspect-ratio:1;border:4px solid transparent;border-radius:22px;background:#fff;box-shadow:0 7px #cfd6ee;font-size:clamp(3rem,15vw,5.5rem);cursor:pointer}.opt:disabled{cursor:default}.opt.correct{border-color:#2ecc71;background:#e8fff1}.opt.wrong{border-color:#ff5a5f;background:#ffecee;opacity:.5}.note{font-size:.95rem;color:#68718c;margin-top:14px}@media(max-width:480px){.card{padding:18px 14px}.opts{gap:8px}}
</style></head>
<body><main class="app">
<section class="card" id="start"><div class="hero">🦸‍♂️🔤</div><h1>Word Hero</h1><p>גיבורי המילים באנגלית!<br>שומעים מילה באנגלית ובוחרים את התמונה המתאימה.</p><p>📝 10 שאלות · ❤️ 3 לבבות</p><button class="btn" id="startBtn">▶ מתחילים!</button><div class="note">אפשר לשמוע שוב בעזרת כפתור Listen. ניתן לבחור גם במקשים 1, 2, 3.</div></section>
<section class="hide" id="game"><div class="top"><span class="lives" id="lives"></span><div class="track"><div class="bar" id="bar"></div></div><span id="count"></span></div><div class="card"><div class="word" id="word"></div><button class="listen" id="listen">🔊 Listen</button><div class="msg" id="msg" aria-live="polite"></div><div class="opts" id="opts"></div></div></section>
<section class="card hide" id="end"><div class="hero" id="endEmoji"></div><h1 id="endTitle"></h1><p id="endText"></p><button class="btn" id="again">🔄 משחק חדש</button></section>
</main>
<script>
'use strict';
const WORDS=[['dog','🐶'],['cat','🐱'],['cow','🐄'],['pig','🐷'],['duck','🦆'],['frog','🐸'],['bee','🐝'],['fish','🐟'],['bird','🐦'],['lion','🦁'],['monkey','🐵'],['elephant','🐘'],['horse','🐴'],['rabbit','🐰'],['mouse','🐭'],['apple','🍎'],['banana','🍌'],['milk','🥛'],['egg','🥚'],['bread','🍞'],['cake','🎂'],['pizza','🍕'],['sun','☀️'],['moon','🌙'],['star','⭐'],['tree','🌳'],['flower','🌸'],['rain','🌧️'],['house','🏠'],['car','🚗'],['bus','🚌'],['bike','🚲'],['boat','⛵'],['book','📖'],['ball','⚽'],['shoe','👟'],['key','🔑'],['clock','⏰'],['heart','❤️']].map(([w,e])=>({w,e}));
const $=id=>document.getElementById(id);let questions=[],index=0,lives=3,score=0,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(word){if(!('speechSynthesis'in window)){ $('msg').textContent='הקול אינו נתמך בדפדפן הזה';return }speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function startGame(){if('speechSynthesis'in window)speechSynthesis.cancel();questions=shuffle(WORDS).slice(0,10);index=score=0;lives=3;$('start').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');showQuestion()}
function showQuestion(){locked=false;const answer=questions[index],options=shuffle([answer,...shuffle(WORDS.filter(x=>x.w!==answer.w)).slice(0,2)]);$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('count').textContent=`${index+1} / 10`;$('bar').style.width=`${index*10}%`;$('word').textContent=answer.w;$('msg').textContent='';$('opts').replaceChildren();options.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=item.e;b.setAttribute('aria-label','אפשרות '+item.w);b.onclick=()=>choose(b,item);$('opts').appendChild(b)});setTimeout(()=>{if(!locked)speak(answer.w)},350)}
function choose(button,item){if(locked||button.disabled)return;const answer=questions[index];if(item.w===answer.w){locked=true;score++;button.classList.add('correct');$('msg').textContent='נכון! כל הכבוד! 🎉';[...$('opts').children].forEach(b=>b.disabled=true);setTimeout(()=>{index++;index===questions.length?finish(true):showQuestion()},900)}else{lives--;button.classList.add('wrong');button.disabled=true;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('msg').textContent=lives?'כמעט! נסו שוב 😊':'נגמרו הלבבות';if(!lives){locked=true;[...$('opts').children].forEach(b=>b.disabled=true);setTimeout(()=>finish(false),900)}}}
function finish(done){if('speechSynthesis'in window)speechSynthesis.cancel();$('game').classList.add('hide');$('end').classList.remove('hide');$('endEmoji').textContent=done?'🏆':'💔';$('endTitle').textContent=done?'כל הכבוד! סיימתם את המשחק!':'לא נורא, מנסים שוב!';$('endText').textContent=`עניתם נכון על ${score} מתוך 10 שאלות.`}
$('startBtn').onclick=startGame;$('again').onclick=startGame;$('listen').onclick=()=>{if(questions[index])speak(questions[index].w)};document.addEventListener('keydown',e=>{if(!['1','2','3'].includes(e.key)||$('game').classList.contains('hide'))return;const b=$('opts').children[Number(e.key)-1];if(b&&!b.disabled)b.click()});
</script></body></html>
